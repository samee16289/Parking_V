<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMC Parking - Smart Scan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .active-btn { border-color: #1e40af !important; background-color: #eff6ff !important; color: #1e40af !important; }
        #sideMenu { transition: transform 0.3s ease; transform: translateX(-100%); }
        #sideMenu.open { transform: translateX(0); }
        .pay-btn { transition: all 0.2s; border: 2px solid #e2e8f0; }
        .active-pay { border-color: #10b981 !important; background-color: #ecfdf5 !important; color: #065f46 !important; }
        
        #camOverlay { display: none; position: fixed; inset: 0; background: black; z-index: 100; flex-direction: column; align-items: center; justify-content: center; }
        #video { width: 100%; height: 100%; object-fit: cover; }
        
        /* Specific scan window size for Indian Plates */
        .scan-window { 
            position: absolute; 
            border: 3px solid #fbbf24; 
            width: 85%; 
            height: 120px; 
            border-radius: 12px; 
            box-shadow: 0 0 0 1000px rgba(0,0,0,0.7); 
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        @media print {
            body * { visibility: hidden; }
            #printReceiptArea, #printReceiptArea * { visibility: visible; }
            #printReceiptArea { position: absolute; left: 0; top: 0; width: 58mm; }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans">
    
    <audio id="beepSound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>

    <div class="bg-blue-800 text-white p-4 flex items-center shadow-lg">
        <button onclick="toggleMenu()" class="text-2xl p-2"><i class="fas fa-bars"></i></button>
        <div class="flex-1 text-center pr-8">
            <h1 class="text-xl font-black italic uppercase">SMC Entry</h1>
        </div>
    </div>

    <div id="sideMenu" class="fixed inset-y-0 left-0 w-64 bg-slate-900 z-50 p-6 shadow-2xl">
        <button onclick="toggleMenu()" class="text-white text-2xl mb-8"><i class="fas fa-times"></i></button>
        <div class="space-y-6">
            <a href="index.html" class="block text-blue-400 font-bold uppercase tracking-wider"><i class="fas fa-plus-circle mr-2"></i> Entry Point</a>
            <a href="admin.html" class="block text-slate-300 font-bold uppercase tracking-wider"><i class="fas fa-search mr-2"></i> Exit / Search</a>
        </div>
    </div>
    <div id="overlay" onclick="toggleMenu()" class="fixed inset-0 bg-black/50 hidden z-40"></div>

    <div class="max-w-md mx-auto p-4">
        <div id="formSection" class="bg-white rounded-[2rem] shadow-xl p-6 space-y-5 border border-slate-100">
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Vehicle Number</label>
                <div class="relative">
                    <input id="vehNo" type="text" placeholder="GJ05XX0000" class="w-full p-4 pr-14 bg-slate-50 border-2 rounded-2xl text-2xl font-black text-center uppercase outline-none focus:border-blue-500 shadow-inner">
                    <button onclick="openCam()" class="absolute right-3 top-1/2 -translate-y-1/2 text-blue-600 p-2 text-xl active:scale-90 transition-transform">
                        <i class="fas fa-camera"></i>
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <button onclick="sel('2',10,this)" class="t-btn p-4 border-2 rounded-2xl bg-slate-50 font-bold flex flex-col items-center">
                    <span class="text-2xl">🏍️</span><span class="text-[9px] mt-1 uppercase">2-Wheeler (₹10)</span>
                </button>
                <button onclick="sel('3',40,this)" class="t-btn p-4 border-2 rounded-2xl bg-slate-50 font-bold flex flex-col items-center">
                    <span class="text-2xl">🛺</span><span class="text-[9px] mt-1 uppercase">3-Wheeler (₹40)</span>
                </button>
                <button onclick="sel('4',50,this)" class="t-btn p-4 border-2 rounded-2xl bg-slate-50 font-bold flex flex-col items-center">
                    <span class="text-2xl">🚗</span><span class="text-[9px] mt-1 uppercase">4-Wheeler (₹50)</span>
                </button>
                <button onclick="sel('Truck',100,this)" class="t-btn p-4 border-2 rounded-2xl bg-slate-50 font-bold flex flex-col items-center">
                    <span class="text-2xl">🚚</span><span class="text-[9px] mt-1 uppercase">Truck/Eicher (₹100)</span>
                </button>
            </div>

            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Payment Method</label>
                <div class="grid grid-cols-2 gap-3 mt-1">
                    <button onclick="setPayMode('Cash', this)" class="pay-btn p-3 rounded-xl font-bold flex items-center justify-center gap-2 active-pay">
                        <i class="fas fa-money-bill-wave"></i> Cash
                    </button>
                    <button onclick="setPayMode('Online', this)" class="pay-btn p-3 rounded-xl font-bold flex items-center justify-center gap-2">
                        <i class="fas fa-qrcode"></i> Online
                    </button>
                </div>
            </div>

            <div class="bg-slate-900 p-5 rounded-2xl flex justify-between items-center text-white">
                <span id="displayTotal" class="text-3xl font-black italic text-emerald-400 w-full text-center">₹0</span>
            </div>

            <button id="submitBtn" onclick="submitEntry()" class="w-full bg-blue-600 text-white font-black py-5 rounded-2xl shadow-xl uppercase">Confirm & Save</button>
        </div>

        <div id="receipt" class="hidden bg-white rounded-[2rem] p-8 text-center shadow-2xl">
            <div class="w-20 h-20 bg-emerald-500 text-white rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg shadow-emerald-200">
                <i class="fas fa-check text-3xl"></i>
            </div>
            <h2 class="text-2xl font-black mb-2 italic text-emerald-600">SUCCESSFULLY SAVED</h2>
            <p id="resInfo" class="font-black text-3xl mb-4 tracking-tighter text-slate-800"></p>
            
            <div id="qrContainer" class="hidden mb-6 flex justify-center p-4 bg-slate-50 rounded-2xl border-2 border-dashed border-slate-200">
                <div id="qrcode"></div>
            </div>

            <div class="space-y-3">
                <button onclick="printBill()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-black uppercase flex items-center justify-center gap-2 shadow-lg">
                    <i class="fas fa-print"></i> Print Receipt
                </button>
                <button onclick="location.reload()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-black uppercase">Next Vehicle</button>
            </div>
        </div>
    </div>

    <div id="camOverlay">
        <video id="video" autoplay playsinline></video>
        <div class="scan-window"></div>
        <canvas id="canvas" class="hidden"></canvas>
        
        <div class="absolute bottom-10 flex flex-col gap-4 w-full px-6 items-center">
            <div id="scanStatus" class="text-white bg-black/70 px-6 py-3 rounded-2xl mb-2 hidden flex items-center gap-3">
                <div class="loader"></div> <span id="statusText">Processing Photo...</span>
            </div>
            <div class="flex gap-4 w-full">
                <button onclick="closeCam()" class="flex-1 bg-white/20 backdrop-blur text-white py-4 rounded-2xl font-bold uppercase">Back</button>
                <button id="snapBtn" onclick="snap()" class="flex-[2] bg-blue-600 text-white py-4 rounded-2xl font-black uppercase shadow-lg">Click Photo</button>
                <button onclick="toggleFlash()" class="flex-1 bg-white/20 backdrop-blur text-white py-4 rounded-2xl text-xl"><i class="fas fa-bolt"></i></button>
            </div>
        </div>
    </div>

    <div id="printReceiptArea" class="hidden"></div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbz6kvy4Wn8dmmXVbcx2gg-PI8D6a30l7x5Z7X6Xn4FwrfycrJ3A403_wm1batb39_8N/exec';
        const OCR_KEY = 'K82387542888957';
        
        let amt = 0, type = "", payMode = "Cash", stream = null, flash = false;

        function toggleMenu() {
            document.getElementById('sideMenu').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('hidden');
        }

        async function openCam() {
            document.getElementById('camOverlay').style.display = 'flex';
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } } 
                });
                document.getElementById('video').srcObject = stream;
            } catch (err) { alert("Camera Error: Check Permissions"); closeCam(); }
        }

        function closeCam() {
            if(stream) stream.getTracks().forEach(t => t.stop());
            document.getElementById('camOverlay').style.display = 'none';
            document.getElementById('scanStatus').classList.add('hidden');
        }

        async function toggleFlash() {
            const track = stream.getVideoTracks()[0];
            flash = !flash;
            try { await track.applyConstraints({ advanced: [{ torch: flash }] }); } catch(e) { }
        }

        async function snap() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const btn = document.getElementById('snapBtn');
            const status = document.getElementById('scanStatus');
            const statusText = document.getElementById('statusText');
            const beep = document.getElementById('beepSound');
            const ctx = canvas.getContext('2d');

            const scanWindow = document.querySelector('.scan-window');
            const rect = scanWindow.getBoundingClientRect();
            const videoRect = video.getBoundingClientRect();

            const scaleX = video.videoWidth / videoRect.width;
            const scaleY = video.videoHeight / videoRect.height;

            const cropX = (rect.left - videoRect.left) * scaleX;
            const cropY = (rect.top - videoRect.top) * scaleY;
            const cropWidth = rect.width * scaleX;
            const cropHeight = rect.height * scaleY;

            canvas.width = cropWidth;
            canvas.height = cropHeight;
            ctx.drawImage(video, cropX, cropY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);

            video.pause();
            btn.disabled = true;
            status.classList.remove('hidden');
            statusText.innerText = "AI Filtering...";

            const base64Image = canvas.toDataURL('image/jpeg', 0.8);
            const formData = new FormData();
            formData.append("base64Image", base64Image);
            formData.append("apikey", OCR_KEY);
            formData.append("OCREngine", "2");

            try {
                const response = await fetch("https://api.ocr.space/parse/image", {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                
                if (result.ParsedResults && result.ParsedResults.length > 0) {
                    let rawText = result.ParsedResults[0].ParsedText.replace(/\s/g, "").toUpperCase();
                    
                    // --- NEW: REMOVE "IND" FROM BLUE TAG AREA ---
                    if (rawText.startsWith("IND")) {
                        rawText = rawText.substring(3);
                    }

                    // --- UPDATED PATTERN: ACCEPTS 1 OR 2 DIGIT DISTRICTS ---
                    const platePattern = /[A-Z]{2}[0-9]{2}[A-Z]{2}[0-9]{4}/;
                    const match = rawText.match(platePattern);

                    if(match) {
                        document.getElementById('vehNo').value = match[0];
                        if(beep) beep.play();
                        closeCam();
                    } else {
                        let cleaned = rawText.replace(/[^A-Z0-9]/gi, "");
                        // Also check for IND in cleaned string
                        if (cleaned.startsWith("IND")) cleaned = cleaned.substring(3);

                        if(cleaned.length >= 8) {
                            document.getElementById('vehNo').value = cleaned.substring(0, 10);
                            if(beep) beep.play();
                            closeCam();
                        } else {
                            alert("Plate not detected clearly. Ensure the plate fills the yellow window.");
                            video.play();
                        }
                    }
                } else {
                    alert("No text detected.");
                    video.play();
                }
            } catch (err) {
                alert("Connection Error.");
                video.play();
            } finally {
                btn.disabled = false;
                status.classList.add('hidden');
            }
        }

        function sel(t, r, btn) {
            type = (t === 'Truck') ? "Truck/Eicher" : t + "-Wheel"; 
            amt = r;
            document.querySelectorAll('.t-btn').forEach(b => b.classList.remove('active-btn'));
            btn.classList.add('active-btn');
            document.getElementById('displayTotal').innerText = "₹" + r;
        }

        function setPayMode(mode, btn) {
            payMode = mode;
            document.querySelectorAll('.pay-btn').forEach(b => b.classList.remove('active-pay'));
            btn.classList.add('active-pay');
        }

        async function submitEntry() {
            const v = document.getElementById('vehNo').value.toUpperCase().trim();
            if(!v || !type) return alert("Vehicle No and Type required!");
            document.getElementById('submitBtn').innerText = "SAVING...";
            
            await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ vehicle: v, type: type, amount: amt, mode: payMode }) });
            
            document.getElementById('formSection').classList.add('hidden');
            document.getElementById('receipt').classList.remove('hidden');
            document.getElementById('resInfo').innerText = v;

            if(payMode === 'Online') {
                const upiLink = `upi://pay?pa=s8834774@oksbi&pn=SMC_Parking&am=${amt}&cu=INR`;
                const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(upiLink)}`;
                document.getElementById('qrcode').innerHTML = `<img src="${qrUrl}" alt="QR">`;
                document.getElementById('qrContainer').classList.remove('hidden');
            }
        }

        function printBill() {
            const veh = document.getElementById('vehNo').value.toUpperCase();
            const date = new Date().toLocaleString();
            const printArea = document.getElementById('printReceiptArea');
            
            printArea.innerHTML = `
                <div style="font-family: monospace; width: 58mm; text-align: center; border: 1px solid #000; padding: 10px;">
                    <h2 style="margin:0; font-size:16px;">SMC PARKING</h2>
                    <hr style="border-top: 1px dashed #000;">
                    <p style="margin:5px 0;">DATE: ${date}</p>
                    <h1 style="margin:5px 0; font-size:22px;">${veh}</h1>
                    <p style="margin:5px 0;">TYPE: ${type}</p>
                    <hr style="border-top: 1px dashed #000;">
                    <h2 style="margin:5px 0;">TOTAL: ₹${amt}</h2>
                    <p style="margin:5px 0;">PAID: ${payMode}</p>
                </div>
            `;
            window.print();
        }
    </script>
</body>
</html>
